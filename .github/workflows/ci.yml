name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Migrações + RLS num Postgres temporário (o runner Ubuntu já traz o PostgreSQL).
      - run: npm run test:banco
      # Vídeos das aulas: existem e tocam dentro do app? (oEmbed do YouTube).
      # Não trava o PR (vídeo pode sair do ar a qualquer momento); veja o resultado no log.
      - run: npm run verificar:videos
        continue-on-error: true
      - run: npm run build
